<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BRANES · Descubrimiento de práctica</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

:root{
  --indigo:#4B3FCF; --violet:#7C6CF2; --blue:#39A0FF;
  --grad: linear-gradient(120deg, var(--indigo), var(--violet) 55%, var(--blue));
  --bg:#08080D; --surface:#111116; --surface-2:#191A20; --surface-3:#232430;
  --border:rgba(255,255,255,0.09); --border-soft:rgba(255,255,255,0.05);
  --text:#F3F2FA; --text-dim:#AEACC2; --muted:#6E6C82;
  --radius:10px; --radius-lg:16px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100dvh; overflow-x:hidden;
}
.display{font-family:'Bricolage Grotesque',system-ui,sans-serif; font-optical-sizing:auto;}
.mono{font-family:'JetBrains Mono',monospace;}

.glow{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 18% -8%, rgba(75,63,207,0.32), transparent 65%),
    radial-gradient(ellipse 50% 35% at 100% 10%, rgba(57,160,255,0.14), transparent 60%);
}

#app{position:relative; z-index:1; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;}

/* ---------- progress ---------- */
.progress-track{position:fixed; top:0; left:0; right:0; height:3px; background:var(--border-soft); z-index:20;}
.progress-fill{height:100%; background:var(--grad); transition:width .35s ease;}

/* ---------- shell ---------- */
.shell{
  flex:1; display:flex; flex-direction:column; width:100%; max-width:560px; margin:0 auto;
  padding:56px 24px 24px;
}
.topbar{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:34px; min-height:24px;
}
.back-btn{
  display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--muted);
  font-family:'Inter',sans-serif; font-size:13px; cursor:pointer; padding:4px 0;
}
.back-btn:hover{color:var(--text-dim);}
.back-btn svg{width:14px; height:14px;}
.step-meta{display:flex; align-items:center; gap:10px;}
.eyebrow{font-size:11px; color:var(--text-dim); letter-spacing:.06em; font-weight:600;}
.counter{font-size:11px; color:var(--muted);}

.content{flex:1; display:flex; flex-direction:column; justify-content:flex-start; padding-bottom:110px;}
.q-prompt{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:25px; line-height:1.32; letter-spacing:-.01em; margin-bottom:8px;}
.q-hint{font-size:14px; color:var(--muted); margin-bottom:26px; line-height:1.5;}

/* ---------- inputs ---------- */
textarea.field-input{
  width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  color:var(--text); font-family:'Inter',sans-serif; font-size:15px; line-height:1.55; padding:16px;
  resize:vertical; min-height:140px;
}
textarea.field-input::placeholder{color:var(--muted);}
textarea.field-input:focus{outline:none; border-color:var(--violet);}

.opt-list{display:flex; flex-direction:column; gap:10px;}
.opt{
  display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--radius);
  background:var(--surface); border:1px solid var(--border); cursor:pointer; transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--muted);}
.opt.active{border-color:var(--violet); background:var(--surface-2);}
.opt-mark{
  width:19px; height:19px; border-radius:50%; border:1.5px solid var(--muted); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; transition:.12s;
}
.opt.active .opt-mark{border-color:var(--violet); background:var(--grad);}
.opt.multi .opt-mark{border-radius:5px;}
.opt-mark svg{width:11px; height:11px; opacity:0; color:#08080D; transition:.12s;}
.opt.active .opt-mark svg{opacity:1;}
.opt-label{font-size:14.5px; color:var(--text); font-weight:500; line-height:1.4;}

.other-input{
  margin-top:2px; width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius);
  color:var(--text); font-family:'Inter',sans-serif; font-size:14px; padding:11px 14px;
}
.other-input:focus{outline:none; border-color:var(--violet);}
.other-input::placeholder{color:var(--muted);}
.other-wrap{margin:-2px 0 2px; padding-left:2px;}

.skip-note{font-size:12.5px; color:var(--muted); margin-top:16px;}

/* ---------- footer / cta ---------- */
.footer-cta{
  position:fixed; left:0; right:0; bottom:0; z-index:15;
  background:linear-gradient(to top, var(--bg) 55%, transparent);
  padding:26px 24px 28px;
}
.footer-inner{max-width:560px; margin:0 auto;}
.btn-continue{
  width:100%; background:var(--grad); color:#05050A; font-weight:700; font-size:14.5px;
  font-family:'Inter',sans-serif; border:none; border-radius:var(--radius); padding:16px;
  display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
}
.btn-continue:disabled{opacity:.35; cursor:not-allowed;}
.btn-continue svg{width:15px; height:15px;}
.btn-continue:not(:disabled):active{filter:brightness(1.08);}

/* ---------- intro / outro ---------- */
.centered-screen{
  flex:1; display:flex; flex-direction:column; justify-content:center; max-width:520px; margin:0 auto;
  padding:40px 26px; text-align:left; min-height:100vh; min-height:100dvh;
}
.wordmark{font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:.16em; font-weight:500; color:var(--text-dim); margin-bottom:40px;}
.brand-mark{display:flex; align-items:center; gap:11px; margin-bottom:40px;}
.brand-mark img.symbol{height:26px; width:auto; display:block;}
.brand-mark img.typo{height:15px; width:auto; display:block; margin-top:1px;}
.ig-link{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);
  text-decoration:none; margin-top:6px;
}
.ig-link:hover{color:var(--text-dim);}
.ig-link svg{width:13px; height:13px;}
.topbar-brand{display:flex; align-items:center; gap:8px;}
.topbar-brand img{height:16px; width:auto; display:block;}
.hero-title{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:38px; line-height:1.12; letter-spacing:-.015em; margin-bottom:20px;}
.hero-title .accent{
  background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero-body{font-size:15.5px; color:var(--text-dim); line-height:1.65; margin-bottom:14px; max-width:420px;}
.hero-note{font-size:13.5px; color:var(--muted); margin:22px 0 34px;}
.name-field{margin-bottom:28px;}
.name-field label{display:block; font-size:12px; color:var(--muted); margin-bottom:8px; font-weight:500;}
.name-field input{
  width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  color:var(--text); font-size:15px; padding:14px 16px; font-family:'Inter',sans-serif;
}
.name-field input:focus{outline:none; border-color:var(--violet);}
.name-field input::placeholder{color:var(--muted);}
.btn-start{
  background:var(--grad); color:#05050A; font-weight:700; font-size:14px; font-family:'Inter',sans-serif;
  border:none; border-radius:var(--radius); padding:16px 22px; display:inline-flex; align-items:center; gap:9px;
  cursor:pointer; width:100%; justify-content:center;
}
.btn-start:disabled{opacity:.35; cursor:not-allowed;}
.btn-start svg{width:15px; height:15px;}

.outro-mark{width:44px; height:44px; margin-bottom:28px; display:flex; align-items:center; justify-content:center;}
.outro-mark img{width:100%; height:100%; object-fit:contain;}

@media (min-width:640px){
  .shell{padding-top:64px;}
  .q-prompt{font-size:29px;}
  .hero-title{font-size:44px;}
}
</style>

/* ============================= STATE ============================= */

let state = {
  screen: "intro",      // intro | question | outro
  respondentName: "",
  answers: {},           // { qId: value(s) }
  otherText: {},         // { qId: "custom text" }
  stepIndex: 0,
  startedAt: null,
};

function flatQuestionOrder(){
  return SECTIONS.flatMap(s => s.qs);
}

function isSectionVisible(sectionIdx, answers){
  if (sectionIdx === 3) { // "Tu equipo" — only if not solo
    return answers.q4 && answers.q4 !== "Principalmente sola/o";
  }
  return true;
}

function isQuestionVisible(id, answers){
  if (id === "q18b") {
    return answers.q18 === "Ocasionalmente" || answers.q18 === "Casi en cada reserva";
  }
  return true;
}

function visibleSteps(){
  const steps = [];
  SECTIONS.forEach((sec, si) => {
    if (!isSectionVisible(si, state.answers)) return;
    sec.qs.forEach(id => {
      if (isQuestionVisible(id, state.answers)) steps.push({ id, sectionIdx: si });
    });
  });
  return steps;
}

function isAnswered(id){
  const q = QUESTIONS[id];
  const a = state.answers[id];
  if (!q.required) return true;
  if (q.type === "long") return !!(a && a.trim().length > 0);
  if (q.type === "single") {
    if (!a) return false;
    if (a === "Otro") return !!(state.otherText[id] && state.otherText[id].trim().length > 0);
    return true;
  }
  if (q.type === "multi") {
    if (!Array.isArray(a) || a.length === 0) return false;
    if (a.includes("Otro")) return !!(state.otherText[id] && state.otherText[id].trim().length > 0);
    return true;
  }
  return true;
}

/* ============================= RENDER ============================= */

const app = document.getElementById("app");
const progressFill = document.getElementById("progressFill");

function render(){
  if (state.screen === "intro") return renderIntro();
  if (state.screen === "outro") return renderOutro();
  return renderQuestion();
}

function renderIntro(){
  progressFill.style.width = "0%";
  app.innerHTML = `
    <div class="centered-screen">
      <div class="brand-mark">
        <img class="symbol" src="${LOGO_SYMBOL}" alt="">
        <img class="typo" src="${LOGO_TYPO}" alt="BRANES">
      </div>
      <div class="hero-title">Descubrimiento<br>de <span class="accent">práctica</span></div>
      <p class="hero-body">Este breve descubrimiento nos ayuda a entender cómo trabajas hoy, qué estás construyendo y hacia dónde quieres ir.</p>
      <p class="hero-body">No hay respuestas correctas ni incorrectas. Responde según cómo funcionan las cosas hoy — aunque todavía estén cambiando.</p>
      <p class="hero-note">Tiempo estimado: 5–8 minutos</p>
      <div class="name-field">
        <label>Tu nombre</label>
        <input id="nameInput" type="text" placeholder="¿Cómo te llamas?" value="${escapeAttr(state.respondentName)}">
      </div>
      <button class="btn-start" id="startBtn" ${state.respondentName.trim() ? "" : "disabled"}>
        Comenzar descubrimiento ${ICONS.arrow}
      </button>
      ${igLink()}
    </div>
  `;
  const nameInput = document.getElementById("nameInput");
  const startBtn = document.getElementById("startBtn");
  nameInput.addEventListener("input", e => {
    state.respondentName = e.target.value;
    startBtn.disabled = !state.respondentName.trim();
  });
  startBtn.addEventListener("click", () => {
    if (!state.respondentName.trim()) return;
    state.startedAt = Date.now();
    state.screen = "question";
    state.stepIndex = 0;
    render();
  });
}

function renderQuestion(){
  const steps = visibleSteps();
  if (state.stepIndex >= steps.length) { finishSurvey(); return; }
  const { id, sectionIdx } = steps[state.stepIndex];
  const q = QUESTIONS[id];
  const section = SECTIONS[sectionIdx];
  const pct = Math.round(((state.stepIndex) / steps.length) * 100);
  progressFill.style.width = pct + "%";

  let bodyHtml = "";
  if (q.type === "long") {
    bodyHtml = `<textarea class="field-input" id="qInput" placeholder="${escapeAttr(q.placeholder||"")}">${escapeHtml(state.answers[id]||"")}</textarea>`;
    if (!q.required) bodyHtml += `<div class="skip-note">Esta pregunta es opcional.</div>`;
  } else {
    const current = state.answers[id];
    const isMulti = q.type === "multi";
    bodyHtml = `<div class="opt-list" id="optList">`;
    q.options.forEach(opt => {
      const active = isMulti ? (Array.isArray(current) && current.includes(opt)) : current === opt;
      bodyHtml += `
        <div class="opt ${isMulti ? "multi" : ""} ${active ? "active" : ""}" data-opt="${escapeAttr(opt)}">
          <span class="opt-mark">${ICONS.check}</span>
          <span class="opt-label">${escapeHtml(opt)}</span>
        </div>`;
    });
    bodyHtml += `</div>`;
    const showOther = isMulti ? (Array.isArray(current) && current.includes("Otro")) : current === "Otro";
    if (q.other && showOther) {
      bodyHtml += `<div class="other-wrap" style="margin-top:12px;">
        <input class="other-input" id="otherInput" type="text" placeholder="Cuéntanos más..." value="${escapeAttr(state.otherText[id]||"")}">
      </div>`;
    }
    if (q.explain) {
      bodyHtml += `<div class="other-wrap" style="margin-top:12px;">
        <input class="other-input" id="explainInput" type="text" placeholder="¿Quieres explicarlo un poco más? (opcional)" value="${escapeAttr(state.otherText[id+"_explain"]||"")}">
      </div>`;
    }
  }

  app.innerHTML = `
    <div class="shell">
      <div class="topbar">
        ${state.stepIndex > 0 ? `<button class="back-btn" id="backBtn">${ICONS.back} Atrás</button>` : `<div class="topbar-brand"><img src="${LOGO_SYMBOL}" alt="BRANES"></div>`}
        <div class="step-meta">
          <span class="eyebrow">${section.num} · ${section.title}</span>
        </div>
      </div>
      <div class="content">
        <div class="q-prompt">${escapeHtml(q.prompt)}</div>
        ${q.hint ? `<div class="q-hint">${escapeHtml(q.hint)}</div>` : ""}
        ${bodyHtml}
      </div>
    </div>
    <div class="footer-cta">
      <div class="footer-inner">
        <button class="btn-continue" id="continueBtn" ${isAnswered(id) ? "" : "disabled"}>
          Continuar ${ICONS.arrow}
        </button>
      </div>
    </div>
  `;

  if (state.stepIndex > 0) {
    document.getElementById("backBtn").addEventListener("click", () => {
      state.stepIndex -= 1;
      render();
    });
  }

  const continueBtn = document.getElementById("continueBtn");

  if (q.type === "long") {
    const ta = document.getElementById("qInput");
    ta.addEventListener("input", e => {
      state.answers[id] = e.target.value;
      continueBtn.disabled = !isAnswered(id);
    });
  } else {
    const isMulti = q.type === "multi";
    document.querySelectorAll("#optList .opt").forEach(el => {
      el.addEventListener("click", () => {
        const opt = el.getAttribute("data-opt");
        if (isMulti) {
          let arr = Array.isArray(state.answers[id]) ? state.answers[id].slice() : [];
          if (arr.includes(opt)) arr = arr.filter(o => o !== opt);
          else arr.push(opt);
          state.answers[id] = arr;
        } else {
          state.answers[id] = opt;
        }
        render();
      });
    });
    const otherInput = document.getElementById("otherInput");
    if (otherInput) {
      otherInput.addEventListener("input", e => {
        state.otherText[id] = e.target.value;
        continueBtn.disabled = !isAnswered(id);
      });
    }
    const explainInput = document.getElementById("explainInput");
    if (explainInput) {
      explainInput.addEventListener("input", e => {
        state.otherText[id+"_explain"] = e.target.value;
      });
    }
  }

  continueBtn.addEventListener("click", () => {
    if (!isAnswered(id)) return;
    state.stepIndex += 1;
    render();
  });
}

function renderOutro(){
  progressFill.style.width = "100%";
  app.innerHTML = `
    <div class="centered-screen">
      <div class="outro-mark"><img src="${LOGO_SYMBOL}" alt="BRANES"></div>
      <div class="hero-title">Gracias<span class="accent">.</span></div>
      <p class="hero-body">Tu práctica es el punto de partida.</p>
      <p class="hero-body">Vamos a tomar lo que compartiste y convertirlo en una imagen más clara de cómo funciona tu práctica — y en qué se puede convertir.</p>
      <img class="typo" src="${LOGO_TYPO}" alt="BRANES" style="height:16px; width:auto; margin-top:22px;">
      ${igLink()}
    </div>
  `;
}

/* ============================= SUBMIT / STORAGE ============================= */

async function finishSurvey(){
  const steps = visibleSteps();
  const allIds = flatQuestionOrder();
  const shownIds = steps.map(s => s.id);

  const answersOut = {};
  allIds.forEach(id => {
    if (!shownIds.includes(id)) return;
    const q = QUESTIONS[id];
    let val = state.answers[id];
    if (q.type === "multi" && Array.isArray(val) && val.includes("Otro")) {
      val = val.map(v => v === "Otro" ? `Otro: ${state.otherText[id]||""}` : v);
    }
    if (q.type === "single" && val === "Otro") {
      val = `Otro: ${state.otherText[id]||""}`;
    }
    answersOut[id] = {
      question: q.prompt,
      answer: val ?? null,
      explanation: state.otherText[id+"_explain"] || undefined,
    };
  });

  const completionSeconds = state.startedAt ? Math.round((Date.now() - state.startedAt) / 1000) : null;
  const submissionDate = new Date().toISOString();

  const record = {
    survey: "Practice Discovery",
    respondentName: state.respondentName,
    submissionDate,
    completionSeconds,
    answers: answersOut,
    conditionalQuestionsShown: shownIds.filter(id => id === "q18b" || ["q13","q14","q15","q16"].includes(id)),
    allQuestionsInSurvey: allIds,
  };

  // Guardado principal: entra directo a BRANES OS como una propuesta nueva
  // (negocio + cotización en estado "Recibida"), vía una función segura de Supabase.
  let savedToBranes = false;
  try {
    if (sb) {
      const { error } = await sb.rpc("submit_discovery_response", {
        p_respondent_name: state.respondentName,
        p_answers: answersOut,
        p_submission_date: submissionDate,
        p_completion_seconds: completionSeconds,
      });
      if (error) throw error;
      savedToBranes = true;
    }
  } catch (e) {
    console.error("No se pudo guardar en BRANES OS:", e);
  }

  // Respaldo: si además está corriendo dentro de un artifact de Claude, guarda también ahí.
  try {
    const key = `discovery:${slugify(state.respondentName)}:${Date.now()}`;
    if (window.storage && window.storage.set) {
      await window.storage.set(key, JSON.stringify({ ...record, savedToBranes }), true);
    }
  } catch (e) {
    console.error("No se pudo guardar el respaldo local:", e);
  }

  state.screen = "outro";
  render();
}

/* ============================= UTIL ============================= */

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
function slugify(str){
  return String(str||"anon").toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "anon";
}

render();
</script>
